<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>會員登入｜大仁哥的珠寶小舖</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=20261125f">
</head>
<body data-page="member">
  <a class="skip" href="#main">跳到主要內容</a>
  <header id="site-header"></header>
  <main class="wrap" id="main">
    <form id="enter-form" class="login-card panel">
      <h1>會員登入</h1>
      <p class="muted">可使用 Facebook、電話、電子郵件或 LINE ID 註冊或登入，第一次輸入會自動建立會員。</p>
      <div id="login-alert" class="alert error" hidden></div>
      <a class="btn btn-block facebook" href="api/members/facebook/start">使用 Facebook 加入或登入</a>
      <button class="btn btn-block phone" id="use-phone" type="button">以電話號碼登入或註冊</button>
      <button class="btn btn-block line" id="use-line" type="button">使用 LINE ID 登入或註冊</button>
      <p class="login-or">或</p>
      <label class="field">姓名（可空白，僅第一次建立會員時使用）<input name="name" maxlength="40" autocomplete="name"></label>
      <label class="field" id="email-field">電子郵件<input name="email" type="email" required autocomplete="email" placeholder="請輸入電子郵件"></label>
      <label class="field" id="phone-field" hidden>電話號碼<input name="phone" maxlength="20" autocomplete="tel" placeholder="請輸入電話號碼"></label>
      <label class="field" id="line-field" hidden>LINE ID<input name="lineId" maxlength="20" autocomplete="username" placeholder="請輸入 LINE ID"></label>
      <input type="hidden" name="method" value="email">
      <label class="field">密碼<input name="password" type="password" required minlength="8" maxlength="72" autocomplete="current-password" placeholder="8 個以上字元"></label>
      <label class="check" style="font-size: 0.85em;"><input name="agree" type="checkbox" required> 我已閱讀並同意<a href="terms.html">服務條款</a>及<a href="privacy.html">隱私政策</a>、<a href="data-deletion.html">用戶資料刪除</a></label>
      <button class="btn btn-block" id="submit-enter" type="submit">登入或註冊</button>
    </form>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/common.js?v=20261125h"></script>
  <script src="js/member.js?v=20261125h"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>結帳｜大仁哥的珠寶小舖</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="cart">
  <a class="skip" href="#main">跳到主要內容</a>
  <header id="site-header"></header>
  <main class="wrap" id="main">
    <h1>結帳</h1>
    <p class="muted">填寫收件資料後，會前往模擬付款。可以不登入。</p>
    <div class="checkout-grid">
      <form id="checkout-form" class="panel">
        <div id="checkout-alert" class="alert error" hidden></div>
        <label class="field">收件人<input name="buyerName" required maxlength="40" autocomplete="name"></label>
        <label class="field">電子郵件<input name="buyerEmail" type="email" required maxlength="120" autocomplete="email"></label>
        <label class="field">電話<input name="buyerPhone" required maxlength="20" autocomplete="tel"></label>
        <label class="field">收件地址<input name="shippingAddress" required maxlength="200" autocomplete="street-address"></label>
        <label class="field">備註（可空白）<textarea name="note" maxlength="300"></textarea></label>
        <button class="btn" type="submit">送出並前往付款</button>
      </form>
      <aside id="checkout-summary" class="panel summary"><p class="muted">訂單載入中…</p></aside>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/common.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>

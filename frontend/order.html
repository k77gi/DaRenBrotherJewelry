<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>訂單｜大仁哥的珠寶小舖</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="member">
  <a class="skip" href="#main">跳到主要內容</a>
  <header id="site-header"></header>
  <main class="wrap" id="main">
    <h1 id="order-title">訂單查詢</h1>
    <div id="order-box"></div>
    <form id="lookup-form" class="panel">
      <p>請輸入下單時的訂單編號與電子郵件。</p>
      <div id="lookup-alert" class="alert error" hidden></div>
      <label class="field">訂單編號<input name="orderNo" required></label>
      <label class="field">電子郵件<input name="email" type="email" required></label>
      <button class="btn" type="submit">查詢</button>
    </form>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/common.js"></script>
  <script src="/js/order.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大仁哥的珠寶小舖</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="home">
  <a class="skip" href="#main">跳到主要內容</a>
  <header id="site-header"></header>
  <main id="main">
    <section id="banner" class="banner" aria-roledescription="carousel" aria-label="主視覺">
      <article class="banner-slide is-active">
        <div>
          <p class="eyebrow">現貨飾品</p>
          <h1>把日常戴得剛剛好</h1>
          <p>珍珠、金飾與玉石，價格、材質和庫存都寫在商品頁。</p>
          <a class="btn" href="/shop.html">進入珠寶小舖</a>
        </div>
        <img src="/images/banners/banner-1.svg" alt="珍珠項鍊">
      </article>
      <article class="banner-slide">
        <div>
          <p class="eyebrow">小白教室</p>
          <h1>第一次買，先看再決定</h1>
          <p>珍珠怎麼看光澤，金飾怎麼保養，兩篇就夠入門。</p>
          <a class="btn" href="/blog.html">去小白教室</a>
        </div>
        <img src="/images/banners/banner-2.svg" alt="金飾保養">
      </article>
      <article class="banner-slide">
        <div>
          <p class="eyebrow">門市與配送</p>
          <h1>滿 3,000 元免運</h1>
          <p>未滿收取 80 元。也可以到大安區門市看看實品。</p>
          <a class="btn" href="/contact.html">與我聯絡</a>
        </div>
        <img src="/images/banners/banner-3.svg" alt="門市">
      </article>
      <button class="banner-arrow prev" type="button" data-dir="prev" aria-label="上一張">‹</button>
      <button class="banner-arrow next" type="button" data-dir="next" aria-label="下一張">›</button>
      <div class="banner-controls">
        <button class="banner-dot is-active" type="button" aria-label="第 1 張"></button>
        <button class="banner-dot" type="button" aria-label="第 2 張"></button>
        <button class="banner-dot" type="button" aria-label="第 3 張"></button>
      </div>
    </section>
    <div class="wrap">
      <div class="section-head">
        <h2>現貨商品</h2>
        <a href="/shop.html">看全部</a>
      </div>
      <div id="product-grid" class="product-grid"><p class="muted">商品載入中…</p></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/common.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
